[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskweb-pro"
version = "0.1.0"
description = "TaskWeb PRO — Azure/Taskweb integration module for the TaskWeb PRO Claude Code skill"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["taskweb_pro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
